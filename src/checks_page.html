<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5b636d; --ok:#1a7f37; --bad:#cf222e; --part:#9a6700; }
    body { margin:0; padding:16px; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--text); }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
    .item { background:var(--card); border-radius:10px; padding:12px 14px; margin-bottom:10px;
            box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
    .num { font-weight:700; }
    .status { font-weight:600; font-size:14px; }
    .прошёл { color:var(--ok); } .не { color:var(--bad); } .частично { color:var(--part); }
    .details { color:var(--muted); font-size:14px; margin-top:4px; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <h1>Проверки</h1>
  <p class="sub">Этап 1 · сейчас <?= nowText ?> · обнови страницу, чтобы проверить заново</p>
  <? results.forEach(function (r) { ?>
    <div class="item">
      <div class="head">
        <span class="num">Тест <?= r.num ?></span>
        <span><?= r.title ?></span>
        <span class="status <?= r.status.split(' ')[0] ?>">— <?= r.status ?></span>
      </div>
      <div class="details"><?= r.details ?></div>
    </div>
  <? }); ?>
</body>
</html>
